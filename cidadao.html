<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cidade Ativa · Minhas ocorrências</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topo">
    <h1>Cidade Ativa</h1>
    <div class="usuario"><span>Olá, <b id="nome-usuario"></b></span><button id="btn-sair" class="btn-ghost">Sair</button></div>
  </header>
  <main>
    <div class="kpis">
      <div class="kpi"><b id="k-total">0</b><span>Registradas</span></div>
      <div class="kpi"><b id="k-and">0</b><span>Em tratamento</span></div>
      <div class="kpi"><b id="k-res">0</b><span>Resolvidas</span></div>
    </div>
    <div class="barra"><h2>Minhas ocorrências</h2><button id="btn-nova" class="btn">+ Nova ocorrência</button></div>
    <div id="lista"></div>
  </main>

  <dialog id="dlg">
    <form id="form" class="modal">
      <h2>Nova ocorrência</h2>
      <label>Foto do problema<input type="file" id="foto" accept="image/*" capture="environment" required></label>
      <img id="preview" alt="Pré-visualização" hidden>
      <label>Descrição<textarea id="descricao" rows="3" required placeholder="Ex.: buraco grande em frente ao nº 120"></textarea></label>
      <div class="local">
        <span class="rotulo">Localização do problema</span>
        <div class="seg seg-local">
          <button type="button" class="on" id="m-gps">Usar minha localização</button>
          <button type="button" id="m-man">Digitar endereço</button>
        </div>
        <div id="bloco-gps"><button type="button" id="btn-gps" class="btn-sec">Obter minha localização</button></div>
        <div id="bloco-man" hidden>
          <div class="linha"><input id="endereco" placeholder="Rua, número, bairro" autocomplete="street-address"><button type="button" id="btn-buscar" class="btn-sec">Buscar</button></div>
          <div id="sugestoes"></div>
        </div>
        <p id="gps-status" class="dica">Localização não definida</p>
      </div>
      <label>Categoria<select id="categoria"></select></label>
      <button type="button" id="btn-ia" class="btn-sec">Sugerir categoria com IA</button>
      <p id="ia-status" class="dica"></p>
      <div class="acoes"><button type="button" id="btn-cancelar" class="btn-sec">Cancelar</button><button class="btn">Enviar</button></div>
    </form>
  </dialog>
  <div id="toast" class="toast"></div>
  <script src="js/comum.js"></script>
  <script src="js/ia.js"></script>
  <script src="js/geo.js"></script>
  <script src="js/cidadao.js"></script>
</body>
</html>
