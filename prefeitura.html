<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cidade Ativa · Painel da Prefeitura</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="pref">
  <header class="topo">
    <h1>Painel da Prefeitura</h1>
    <div class="usuario"><span><b id="nome-usuario"></b></span><button id="btn-sair" class="btn-ghost">Sair</button></div>
  </header>
  <main class="largo">
    <div class="kpis" id="kpis"></div>
    <div class="grade">
      <div class="card"><h2>Mapa</h2><div id="mapa"></div></div>
      <div class="card">
        <h2>Ocorrências</h2>
        <div class="filtros">
          <input id="busca" type="search" placeholder="Buscar na descrição ou autor...">
          <select id="f-cat"><option value="">Todas as categorias</option></select>
        </div>
        <div id="lista" class="rolagem"></div>
      </div>
    </div>
  </main>
  <dialog id="dlg"><div id="det" class="modal"></div></dialog>
  <div id="toast" class="toast"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/comum.js"></script>
  <script src="js/prefeitura.js"></script>
</body>
</html>
